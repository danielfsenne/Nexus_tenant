services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5433:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nexus-backend
    environment:
      NEXUS_DB_HOST: postgres
      NEXUS_DB_PORT: 5432
      NEXUS_DB_NAME: nexus
      NEXUS_DB_USER: nexus
      NEXUS_DB_PASSWORD: nexus
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      NEXUS_RABBITMQ_HOST: rabbitmq
      NEXUS_RABBITMQ_PORT: 5672
      NEXUS_RABBITMQ_USER: nexus
      NEXUS_RABBITMQ_PASSWORD: nexus
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?defina NEXUS_JWT_SECRET no .env}
      NEXUS_FRONTEND_URL: ${NEXUS_FRONTEND_URL:-http://localhost:8082}
      NEXUS_MAIL_ENABLED: ${NEXUS_MAIL_ENABLED:-false}
      NEXUS_MAIL_USERNAME: ${NEXUS_MAIL_USERNAME:-}
      NEXUS_MAIL_PASSWORD: ${NEXUS_MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${NEXUS_API_URL:-http://localhost:8080}
    container_name: nexus-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  nexus_postgres_data:
