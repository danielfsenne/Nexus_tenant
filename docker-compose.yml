services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5433:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: nexus-backend
    environment:
      NEXUS_DB_HOST: postgres
      NEXUS_DB_PORT: 5432
      NEXUS_DB_NAME: nexus
      NEXUS_DB_USER: nexus
      NEXUS_DB_PASSWORD: nexus
      NEXUS_DB_APP_USER: nexus_app
      NEXUS_DB_APP_PASSWORD: ${NEXUS_DB_APP_PASSWORD:-nexus_app}
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      NEXUS_RABBITMQ_HOST: rabbitmq
      NEXUS_RABBITMQ_PORT: 5672
      NEXUS_RABBITMQ_USER: nexus
      NEXUS_RABBITMQ_PASSWORD: nexus
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?defina NEXUS_JWT_SECRET no .env}
      NEXUS_FRONTEND_URL: ${NEXUS_FRONTEND_URL:-http://localhost:8082}
      NEXUS_MAIL_ENABLED: ${NEXUS_MAIL_ENABLED:-false}
      NEXUS_MAIL_USERNAME: ${NEXUS_MAIL_USERNAME:-}
      NEXUS_MAIL_PASSWORD: ${NEXUS_MAIL_PASSWORD:-}
      NEXUS_RATE_LIMIT_ENABLED: ${NEXUS_RATE_LIMIT_ENABLED:-true}
      NEXUS_CORS_ALLOWED_ORIGINS: ${NEXUS_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8082}
      NEXUS_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${NEXUS_API_URL:-http://localhost:8080}
    container_name: nexus-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: nexus-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nexus_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    container_name: nexus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${NEXUS_GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - nexus_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: nexus-tempo
    # A imagem roda como usuário não-root por padrão e não consegue
    # escrever no volume nomeado (fica com dono root até algo escrever
    # nele primeiro). Rodar como root aqui é aceitável: é só um
    # observabilidade local, sem exposição fora da rede do compose.
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - nexus_tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

volumes:
  nexus_postgres_data:
  nexus_prometheus_data:
  nexus_grafana_data:
  nexus_tempo_data:
