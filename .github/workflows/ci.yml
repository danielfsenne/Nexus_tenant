name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Testes
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend (testes unitários + type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Testes unitários (Vitest)
        working-directory: frontend
        run: npm run test:unit

      - name: Build (inclui type-check via vue-tsc)
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env para a stack
        run: |
          cat <<EOF > .env
          NEXUS_JWT_SECRET=$(openssl rand -hex 32)
          NEXUS_MAIL_ENABLED=false
          NEXUS_RATE_LIMIT_ENABLED=false
          NEXUS_FRONTEND_URL=http://localhost:8082
          NEXUS_API_URL=http://localhost:8080
          EOF

      - name: Subir a stack completa (docker compose)
        run: docker compose up -d --build

      - name: Esperar o backend responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "Backend não respondeu a tempo."
          docker compose logs backend
          exit 1

      - name: Esperar o frontend responder
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/ || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "Frontend não respondeu a tempo."
          docker compose logs frontend
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8082
        run: npx playwright test

      - name: Logs da stack (se algo falhar)
        if: failure()
        run: docker compose logs

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Build & push das imagens Docker
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-backend:latest
            ghcr.io/${{ github.repository_owner }}/nexus-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nexus-frontend:latest
            ghcr.io/${{ github.repository_owner }}/nexus-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
