spring:
  datasource:
    url: jdbc:h2:mem:nexus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  cache:
    type: simple

  rabbitmq:
    listener:
      simple:
        auto-startup: false

nexus:
  jwt:
    secret: segredo-de-teste-apenas-para-testes-automatizados-0000
    expiration-minutes: 60
  rate-limit:
    enabled: false
    auth-max-attempts: 10
    auth-window-seconds: 60
  order-processing:
    max-attempts: 3
    base-delay-ms: 3000
  maintenance:
    cron: "0 0 3 * * *"
