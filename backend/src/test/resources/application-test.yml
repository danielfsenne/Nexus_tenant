spring:
  datasource:
    url: jdbc:h2:mem:nexus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

nexus:
  jwt:
    secret: segredo-de-teste-apenas-para-testes-automatizados-0000
    expiration-minutes: 60
