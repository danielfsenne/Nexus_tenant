spring:
  application:
    name: nexus-backend

  datasource:
    # Pool principal da aplicação (JPA/Hikari): usa a role restrita
    # nexus_app (sem SUPERUSER/BYPASSRLS, criada na migration V8), sujeita
    # às policies de Row-Level Security.
    url: jdbc:postgresql://${NEXUS_DB_HOST:localhost}:${NEXUS_DB_PORT:5433}/${NEXUS_DB_NAME:nexus}
    username: ${NEXUS_DB_APP_USER:nexus_app}
    password: ${NEXUS_DB_APP_PASSWORD:nexus_app}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # As migrations rodam com a role administrativa (que tem privilégio de
    # DDL/CREATE ROLE), separada da role restrita usada pelo pool principal
    # acima — ver spring.datasource.
    url: jdbc:postgresql://${NEXUS_DB_HOST:localhost}:${NEXUS_DB_PORT:5433}/${NEXUS_DB_NAME:nexus}
    user: ${NEXUS_DB_USER:nexus}
    password: ${NEXUS_DB_PASSWORD:nexus}
    placeholders:
      appDbPassword: ${NEXUS_DB_APP_PASSWORD:nexus_app}

  data:
    redis:
      host: ${NEXUS_REDIS_HOST:localhost}
      port: ${NEXUS_REDIS_PORT:6379}
      password: ${NEXUS_REDIS_PASSWORD:}
      ssl:
        enabled: ${NEXUS_REDIS_SSL_ENABLED:false}

  rabbitmq:
    host: ${NEXUS_RABBITMQ_HOST:localhost}
    port: ${NEXUS_RABBITMQ_PORT:5672}
    username: ${NEXUS_RABBITMQ_USER:nexus}
    password: ${NEXUS_RABBITMQ_PASSWORD:nexus}
    listener:
      simple:
        auto-startup: ${NEXUS_RABBITMQ_LISTENER_ENABLED:true}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NEXUS_MAIL_USERNAME:danielflausinosenne123@gmail.com}
    password: ${NEXUS_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # O health check de mail testa conectividade SMTP mesmo com
      # nexus.mail.enabled=false, derrubando o health geral da app em
      # ambientes sem credenciais de e-mail configuradas.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 100% das requisições em dev/demo. Numa carga de produção real, isso
      # deve cair bastante (ex.: 0.1) para não sobrecarregar o coletor.
      probability: ${NEXUS_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${NEXUS_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

nexus:
  cors:
    # Origens do navegador que podem chamar a API: Vite dev server (5173) e o
    # frontend servido pelo Nginx no docker-compose local (8082).
    allowed-origins: ${NEXUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8082}
  jwt:
    secret: ${NEXUS_JWT_SECRET:troque-este-segredo-em-producao-1234567890}
    # Access token de vida curta; sessões longas são sustentadas pelo refresh
    # token (opaco, persistido no banco, com rotação a cada uso).
    expiration-minutes: 15
    refresh-expiration-days: 30
  frontend-url: ${NEXUS_FRONTEND_URL:http://localhost:5173}
  invite-expiration-days: 7
  password-reset-expiration-hours: 2
  email-verification-expiration-hours: 24
  rate-limit:
    enabled: ${NEXUS_RATE_LIMIT_ENABLED:true}
    auth-max-attempts: 10
    auth-window-seconds: 60
  order-processing:
    max-attempts: 3
    base-delay-ms: 3000
  maintenance:
    cron: "0 0 3 * * *"
  mail:
    enabled: ${NEXUS_MAIL_ENABLED:true}
    from: ${NEXUS_MAIL_USERNAME:danielflausinosenne123@gmail.com}
