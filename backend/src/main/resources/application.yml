spring:
  application:
    name: nexus-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus
    username: nexus
    password: nexus
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

nexus:
  jwt:
    secret: ${NEXUS_JWT_SECRET:troque-este-segredo-em-producao-1234567890}
    expiration-minutes: 60
  frontend-url: ${NEXUS_FRONTEND_URL:http://localhost:5173}
  invite-expiration-days: 7
  password-reset-expiration-hours: 2
