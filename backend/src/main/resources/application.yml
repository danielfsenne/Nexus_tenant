spring:
  application:
    name: nexus-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/nexus
    username: nexus
    password: nexus
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${NEXUS_REDIS_HOST:localhost}
      port: ${NEXUS_REDIS_PORT:6379}

  cache:
    type: redis

  rabbitmq:
    host: ${NEXUS_RABBITMQ_HOST:localhost}
    port: ${NEXUS_RABBITMQ_PORT:5672}
    username: ${NEXUS_RABBITMQ_USER:nexus}
    password: ${NEXUS_RABBITMQ_PASSWORD:nexus}
    listener:
      simple:
        auto-startup: ${NEXUS_RABBITMQ_LISTENER_ENABLED:true}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${NEXUS_MAIL_USERNAME:danielflausinosenne123@gmail.com}
    password: ${NEXUS_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

nexus:
  jwt:
    secret: ${NEXUS_JWT_SECRET:troque-este-segredo-em-producao-1234567890}
    expiration-minutes: 60
  frontend-url: ${NEXUS_FRONTEND_URL:http://localhost:5173}
  invite-expiration-days: 7
  password-reset-expiration-hours: 2
  rate-limit:
    enabled: true
    auth-max-attempts: 10
    auth-window-seconds: 60
  order-processing:
    max-attempts: 3
    base-delay-ms: 3000
  maintenance:
    cron: "0 0 3 * * *"
  mail:
    enabled: ${NEXUS_MAIL_ENABLED:true}
    from: ${NEXUS_MAIL_USERNAME:danielflausinosenne123@gmail.com}
